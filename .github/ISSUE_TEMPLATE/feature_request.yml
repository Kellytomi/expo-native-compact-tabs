name: Feature request
description: Propose an improvement to the package
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired API or behavior and how it should work across supported iOS versions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand that Android support is not currently implemented.
          required: true
        - label: I searched existing issues and discussions for this proposal.
          required: true
